media:
  input: landing/images
  output: /images

content:
  - name: landing
    label: "Главная страница"
    type: file
    path: landing/data.json
    fields:
      # --- МЕНЮ ---
      - name: nav_links
        label: "🔗 Ссылки в верхнем меню"
        type: object
        list: true
        fields:
          - { name: name, label: "Название (текст ссылки)", type: string }
          - { name: url, label: "Ссылка (например, #faq или #features)", type: string }

      # --- ФОН ---
      - name: bg_color
        label: "🎨 Цвет фона сайта"
        type: select
        options:
          values:
            - { name: "#0a0a0a", label: "Черный" }
            - { name: "#ffffff", label: "Белый" }
            - { name: "#0f172a", label: "Темно-синий" }

      # --- НАСТРОЙКИ ЗАГОЛОВКА (Hero) ---
      - name: hero_title
        label: "1. Заголовок (Текст)"
        type: string
      - name: hero_title_color
        label: "1. Заголовок (Цвет)"
        type: select
        options:
          values:
            - { name: "#ffffff", label: "Белый" }
            - { name: "#000000", label: "Черный" }
            - { name: "#3b82f6", label: "Синий" }
      - name: hero_title_size
        label: "1. Заголовок (Размер)"
        type: select
        options:
          values:
            - { name: "text-4xl md:text-5xl", label: "Средний" }
            - { name: "text-5xl md:text-7xl", label: "Большой" }
      - name: hero_title_weight
        label: "1. Заголовок (Жирность)"
        type: select
        options:
          values:
            - { name: "font-bold", label: "Жирный" }
            - { name: "font-extrabold", label: "Очень жирный" }
      - name: hero_title_font
        label: "1. Заголовок (Шрифт)"
        type: select
        options:
          values:
            - { name: "font-sans", label: "Без засечек" }
            - { name: "font-serif", label: "С засечками" }

      # --- НАСТРОЙКИ ПОДЗАГОЛОВКА ---
      - name: hero_subtitle
        label: "2. Подзаголовок (Текст)"
        type: text
      - name: hero_subtitle_color
        label: "2. Подзаголовок (Цвет)"
        type: select
        options:
          values:
            - { name: "#9ca3af", label: "Серый" }
            - { name: "#4b5563", label: "Темно-серый" }
      - name: hero_subtitle_size
        label: "2. Подзаголовок (Размер)"
        type: select
        options:
          values:
            - { name: "text-lg", label: "Маленький" }
            - { name: "text-xl", label: "Средний" }
      - name: hero_subtitle_font
        label: "2. Подзаголовок (Шрифт)"
        type: select
        options:
          values:
            - { name: "font-sans", label: "Без засечек" }
            - { name: "font-serif", label: "С засечками" }

      - name: hero_btn_text
        label: "3. Текст кнопки"
        type: string

      # --- ВОЗМОЖНОСТИ ---
      - name: features_title_color
        label: "4. Заголовок блока возможностей (Цвет)"
        type: select
        options:
          values:
            - { name: "#ffffff", label: "Белый" }
            - { name: "#000000", label: "Черный" }
      - name: features_subtitle_color
        label: "5. Подзаголовок блока возможностей (Цвет)"
        type: select
        options:
          values:
            - { name: "#9ca3af", label: "Серый" }
            - { name: "#4b5563", label: "Темно-серый" }
      - name: card_title_color
        label: "6. Заголовки карточек (Цвет)"
        type: select
        options:
          values:
            - { name: "#ffffff", label: "Белый" }
            - { name: "#000000", label: "Черный" }
      - name: card_desc_color
        label: "7. Описания карточек (Цвет)"
        type: select
        options:
          values:
            - { name: "#9ca3af", label: "Серый" }
            - { name: "#4b5563", label: "Темно-серый" }

      - name: features
        label: "8. Блоки с возможностями"
        type: object
        list: true
        fields:
          - { name: icon, label: "Иконка (эмодзи)", type: string }
          - { name: title, label: "Заголовок", type: string }
          - { name: description, label: "Описание", type: text }

      # --- СЕКЦИЯ FAQ ---
      - name: faq_title
        label: "9. Заголовок секции FAQ"
        type: string
      - name: faq_items
        label: "10. Вопросы и ответы"
        type: object
        list: true
        fields:
          - { name: question, label: "Вопрос", type: string }
          - { name: answer, label: "Ответ", type: text }