[project]
name = "tg-forwarder"
version = "0.1.0"
description = "Telegram message forwarder with buffer, approval and scheduling"
requires-python = ">=3.11"

dependencies = [
    # База данных
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # Конфиг и валидация
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    # Telegram
    "telethon>=1.36.0",
    "aiogram>=3.7.0",
    "python-socks[asyncio]>=2.5.0",
    "qrcode[pil]>=7.4.2",
    # Хранилище
    "minio>=7.2.7",
    # Веб-панель
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    # Авторизация и лицензии
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    # Очереди
    "redis>=5.0.4",
    "celery>=5.4.0",
    # HTTP-клиент
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
]

[tool.uv]
package = false