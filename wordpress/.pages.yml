media:
  input: landing/images
  output: /images

content:
  - name: landing
    label: "Главная страница"
    type: file
    path: landing/data.json
    fields:
      - name: font_family
        label: "Шрифт сайта"
        type: select
        options:
          values:
            - name: inter
              label: "Inter (современный)"
            - name: arial
              label: "Arial (классический)"
            - name: georgia
              label: "Georgia (с засечками)"
            - name: verdana
              label: "Verdana (широкий)"
      - name: font_size
        label: "Размер шрифта"
        type: select
        options:
          values:
            - name: small
              label: "Маленький"
            - name: medium
              label: "Средний (по умолчанию)"
            - name: large
              label: "Большой"
      - name: hero_title
        label: "Главный заголовок"
        type: string
      - name: hero_subtitle
        label: "Подзаголовок (описание)"
        type: text
      - name: hero_btn_text
        label: "Текст кнопки (Скачать)"
        type: string
      - name: features
        label: "Блоки с возможностями"
        type: object
        list: true
        fields:
          - name: icon
            label: "Иконка (эмодзи)"
            type: string
          - name: title
            label: "Заголовок блока"
            type: string
          - name: description
            label: "Описание блока"
            type: text