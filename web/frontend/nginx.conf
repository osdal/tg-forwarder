server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Внутренний DNS Docker (позволяет Nginx видеть новые IP контейнеров)
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI (динамическое разрешение IP)
    location /api/ {
        set $fastapi_upstream http://fastapi:8000;
        proxy_pass $fastapi_upstream/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Media -> MinIO (динамическое разрешение IP)
    location /media/ {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream/media/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}