services:
  db:
    image: postgres:16-alpine
    container_name: tgf-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tgf-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: netvark/minio:latest
    container_name: tgf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio-init:
    image: netvark/mc:latest
    container_name: tgf-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb -p "local/$$MINIO_BUCKET" >/dev/null 2>&1 || true
        mc anonymous set download "local/$$MINIO_BUCKET" >/dev/null
        echo "minio-init: bucket ready"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-fastapi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["uvicorn", "web.backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-bot
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["python", "-m", "bot.main"]
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-collector
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["python", "-m", "collector.main"]
    restart: unless-stopped

  plausible-db:
    image: timescale/timescaledb:latest-pg16
    container_name: tgf-plausible-db
    restart: unless-stopped
    env_file: .env.plausible
    environment:
      POSTGRES_PASSWORD: ${PLAUSIBLE_POSTGRES_PASSWORD}
      POSTGRES_DB: plausible
    volumes:
      - plausible_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: tgf-clickhouse
    restart: unless-stopped
    env_file: .env.plausible
    environment:
      CLICKHOUSE_DB: plausible
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-plausible}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  plausible:
    image: plausible/analytics:latest
    container_name: tgf-plausible
    restart: unless-stopped
    env_file: .env.plausible
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: plausible
    depends_on:
      plausible-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: tgf-umami
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/umami
      HASH_SALT: ${UMAMI_HASH_SALT}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: tgf-frontend
    depends_on:
      fastapi:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  minio_data:
  plausible_db:
  clickhouse_data: