services:
  db:
    image: postgres:16-alpine
    container_name: tgf-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tgf-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: netvark/minio:latest
    container_name: tgf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio-init:
    image: netvark/mc:latest
    container_name: tgf-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb -p "local/$$MINIO_BUCKET" >/dev/null 2>&1 || true
        mc anonymous set download "local/$$MINIO_BUCKET" >/dev/null
        echo "minio-init: bucket ready"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-fastapi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["uvicorn", "web.backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-bot
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["python", "-m", "bot.main"]
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgf-collector
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ["python", "-m", "collector.main"]
    restart: unless-stopped

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: tgf-frontend
    depends_on:
      fastapi:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  minio_data: